[project]
name = "portalctl"
version = "0.1.0"
description = "Config renderer and controller for the authmesh captive portal walled garden"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "click>=8.1",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
portalctl = "portalctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portalctl*"]

[tool.setuptools.package-data]
portalctl = ["templates/*.j2"]
