# Rendered by portalctl - do not edit by hand.

port=53
listen-address=10.255.0.1
listen-address=2001:db8:255::1
bind-interfaces
no-resolv
no-hosts
cache-size=10000

server=1.1.1.1
server=8.8.8.8

# Portal FQDN resolves to the portal itself inside the walled garden.
address=/portal.company.example/10.255.0.1
address=/portal.company.example/2001:db8:255::1

# Whitelisted domain: resolved addresses are pushed into the nftables sets.
nftset=/pay.company.example/4#inet#captive#whitelist_v4
nftset=/pay.company.example/6#inet#captive#whitelist_v6
