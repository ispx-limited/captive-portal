# Rendered by portalctl - do not edit by hand.
# Run as: nginx -c /run/portal/nginx/nginx.conf

user nginx;
worker_processes auto;
worker_rlimit_nofile 262144;
pid /run/portal/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 65536;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined buffer=64k flush=5s;
    sendfile on;
    keepalive_timeout 15;
    server_tokens off;

    # Hardening: every client is an untrusted quarantined subscriber.
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;
    limit_conn_zone $binary_remote_addr zone=perip_conn:20m;
    limit_conn perip_conn 32;
    limit_req_zone $binary_remote_addr zone=perip_req:20m rate=20r/s;
    limit_req zone=perip_req burst=40 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    server {
        listen 80 default_server reuseport backlog=4096;
        server_name _;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 444;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        # RFC 8908 Captive Portal API. Only used by clients when the BNG's
        # quarantine profile advertises this URL via DHCP option 114 / IPv6 RA
        # (spec-compliant clients require it over HTTPS via portal.tls).
        location = /capport {
            default_type application/captive+json;
            return 200 '{"captive": true, "user-portal-url": "https://pay.company.example/portal"}';
        }

        # Any HTTP request (including OS captive-portal detection probes such
        # as /generate_204, /hotspot-detect.html, /connecttest.txt) gets a 302
        # to the payment portal. The unexpected response marks the network as
        # captive and the OS sign-in sheet loads the target.
        location / {
            return 302 https://pay.company.example/portal;
        }
    }
}
