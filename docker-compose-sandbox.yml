# Self-contained sandbox: the portal stack runs inside the gateway container's
# network namespace (no host networking, no host nftables changes). A fake
# payment portal (paysite) sits on the WAN side and a subscriber container is
# routed through the gateway, exactly like a quarantined BNG session.
#
#   subscriber (10.255.0.50, fd00:255::50) --default route--> gateway (10.255.0.1, fd00:255::1)
#       [subscribers network]                                     |  nftables/nginx/dnsmasq
#                                                                 v  in this netns
#                                paysite (203.0.113.10, fd00:113::10) [wan network]
#
# Usage:
#   docker compose -f docker-compose-sandbox.yml up -d --build
#   ./scripts/sandbox-test.sh
name: captive-portal-sandbox

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  gateway:
    logging: *logging
    image: alpine:3.20
    # Docker does not promise which network becomes eth0, and once both
    # networks carry a gateway it also picks the default route itself, so
    # the interfaces are named by address here and the default route is set
    # explicitly. config/portal-sandbox.yml refers to them as wan and sub.
    command:
      - sh
      - -ec
      - |
        rename() {
          dev=$$(ip -o -f inet addr show | awk -v p="$$1" '$$4 ~ "^"p {print $$2; exit}')
          [ -n "$$dev" ] || { echo "no interface in $$1" >&2; exit 1; }
          ip link set "$$dev" down
          ip link set "$$dev" name "$$2"
          ip link set "$$2" up
        }
        rename 203.0.113. wan
        rename 10.255.0. sub
        ip route replace default via 203.0.113.254 dev wan
        ip -6 route replace default via fd00:113::fffe dev wan
        ip -o -f inet addr show; ip -o -f inet6 addr show; ip route; ip -6 route
        exec tail -f /dev/null
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      # The rename above takes each link down, which would flush its IPv6
      # addresses.
      net.ipv6.conf.all.keep_addr_on_down: "1"
      net.ipv6.conf.default.keep_addr_on_down: "1"
    networks:
      wan:
        ipv4_address: 203.0.113.2
        ipv6_address: fd00:113::2
      subscribers:
        ipv4_address: 10.255.0.1
        ipv6_address: fd00:255::1
    restart: unless-stopped

  portalctl:
    logging: *logging
    build: ./portalctl
    network_mode: service:gateway
    pid: service:gateway
    cap_add:
      - NET_ADMIN
    command: ["watch", "--config", "/etc/portal/portal-sandbox.yml"]
    volumes:
      # Mount the directory, not the file: editors/sed replace the inode and a
      # single-file bind mount would never see changes (breaks hot reload).
      - ./config:/etc/portal:ro
      - ./www:/usr/share/portal/www:ro
      - portal-run:/run/portal
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/run/portal/.ready"]
      interval: 5s
      timeout: 2s
      retries: 30

  nginx:
    logging: *logging
    image: nginx:1.27
    network_mode: service:gateway
    pid: service:gateway
    command: ["nginx", "-g", "daemon off;", "-c", "/run/portal/nginx/nginx.conf"]
    volumes:
      - portal-run:/run/portal
    depends_on:
      portalctl:
        condition: service_healthy
    restart: unless-stopped

  dnsmasq:
    logging: *logging
    build: ./dnsmasq
    network_mode: service:gateway
    pid: service:gateway
    cap_add:
      - NET_ADMIN
    volumes:
      - portal-run:/run/portal
    depends_on:
      portalctl:
        condition: service_healthy
    restart: unless-stopped

  # Simulates the company's payment portal on the WAN side.
  paysite:
    logging: *logging
    image: nginx:1.27
    networks:
      wan:
        ipv4_address: 203.0.113.10
        ipv6_address: fd00:113::10
    restart: unless-stopped

  # Simulated quarantined subscriber. Exec into it to test:
  #   docker compose -f docker-compose-sandbox.yml exec subscriber bash
  subscriber:
    logging: *logging
    image: nicolaka/netshoot:latest
    cap_add:
      - NET_ADMIN
    dns:
      - 10.255.0.1
    networks:
      subscribers:
        ipv4_address: 10.255.0.50
        ipv6_address: fd00:255::50
    command: ["sh", "-c", "ip route replace default via 10.255.0.1 && ip -6 route replace default via fd00:255::1 && exec sleep infinity"]
    depends_on:
      - gateway
    restart: unless-stopped

networks:
  wan:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.254
        - subnet: fd00:113::/64
          gateway: fd00:113::fffe
  subscribers:
    # Not "internal": Docker guards an internal bridge with a host rule that
    # drops frames entering it for any address outside its subnet, and with
    # br_netfilter loaded (Docker loads it) that rule sees bridged frames
    # too. The subscriber's packets for the outside world would be dropped
    # on the way to the gateway container. The subscriber's only route out
    # is still the gateway: its default route is replaced on start.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.255.0.0/24
          gateway: 10.255.0.254
        - subnet: fd00:255::/64
          gateway: fd00:255::fffe

volumes:
  portal-run:
