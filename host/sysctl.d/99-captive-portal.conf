# Captive portal host tuning. Install:
#   sudo cp host/sysctl.d/99-captive-portal.conf /etc/sysctl.d/
#   sudo cp host/modules-load.d/captive-portal.conf /etc/modules-load.d/
#   sudo cp host/modprobe.d/nf_conntrack.conf /etc/modprobe.d/
#   sudo sysctl --system

net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# One conntrack entry per DNAT'd/whitelisted flow (~300 B each, ~300 MB max).
net.netfilter.nf_conntrack_max = 1048576

# Quarantine flows are short-lived junk; don't hold state for the 5-day
# default.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30

# Accept-queue headroom for nginx during probe bursts (matches listen backlog).
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
