<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Suspended</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Your internet service is suspended</h1>
    <p id="message">Your account has an outstanding balance. Please pay your
       bill to restore your connection. Service resumes automatically once
       payment is received.</p>
    <!-- Point this at your payment portal; it must be in whitelist.networks
         or whitelist.domains in portal.yml or customers can't reach it. -->
    <a class="button" href="https://pay.company.example/portal">Pay my bill</a>
    <div class="status"><span class="dot"></span><span id="status-text">Waiting for payment, checking automatically</span></div>
  </div>
  <script src="/js/app.js" defer></script>
</body>
</html>
