name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portalctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Test
        working-directory: portalctl
        run: uv sync && uv run pytest

  # The sandbox is the only end to end proof: a subscriber container routed
  # through the portal, with intercept, drop, whitelist and DNS checked from
  # the subscriber's side.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the sandbox
        run: docker compose -f docker-compose-sandbox.yml up -d --build --wait
      - name: Run the checks
        run: ./scripts/sandbox-test.sh
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose-sandbox.yml logs
      - name: Stop the sandbox
        if: always()
        run: docker compose -f docker-compose-sandbox.yml down -v
